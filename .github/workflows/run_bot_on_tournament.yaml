name: Forecast on new MiniBench questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # backup restart only; the run below keeps itself going

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
permissions:
  contents: read
  actions: write # lets a run start its successor

jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 350
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        # Questions are open for only 3 hours and GitHub's cron fired every
        # 4 to 10 hours on this fork. So one run keeps polling every 10
        # minutes for about 5 hours, then starts its successor below.
        run: |
          end=$(( $(date +%s) + 5*3600 + 15*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            uv run python main.py --mode minibench || echo "::warning::bot run failed, will retry"
            sleep 600
          done
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACALUSTOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERAPIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Tournament logs are public; keep reasoning out of them while questions are open.
          BOT_LOG_LEVEL: WARNING
      - name: Start the next run
        if: always()
        run: gh workflow run run_bot_on_tournament.yaml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
